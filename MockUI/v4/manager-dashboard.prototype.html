<!doctype html>
<!--
  PROTOTYPE, throwaway. Wipe me.
  Question: what should the Manager Overview (M3 in MockUI/v4-plan/PLAN.md section 5) look like?
  Structurally different variants on one route: ?variant=A..P, the dark bar, or the arrow keys.
  Read-only, in-memory data, no persistence. Tokens only from Demo/frontend/tokens.css.
  A "The Yard"    : every Listing is a shipping container; exposure is yard capacity; actions are hang tags.
  B "Voyage map"  : the page is a route map; each Listing is a lane from Jebel Ali; exposure is a hull load line.
  C "Manifest"    : bill-of-lading paper; one huge number, ticket-stub actions, a ruled cargo list.
  D "Calm"        : after docs/refer: greeting, pill search, dark and light hero cards, filter chips, pastel cards, pill tab bar.
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager Overview prototype</title>
<link rel="stylesheet" href="../../Demo/frontend/tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#cfc9b9;font-family:var(--font-sans);color:var(--text);font-size:var(--fs-16);line-height:var(--lh-body)}
.stage{min-height:100vh;display:flex;justify-content:center;padding:24px 0 96px}
.phone{width:390px;max-width:100%;background:var(--surface-page);border-radius:28px;box-shadow:0 20px 60px rgb(20 35 28/.25);overflow:hidden;position:relative;min-height:844px}
body.full .stage{padding:0 0 72px}
body.full .phone{width:100%;max-width:var(--w-content);border-radius:0;box-shadow:none}
.app-head{display:flex;align-items:center;justify-content:space-between;padding:10px var(--gutter);background:var(--surface-card);border-block-end:1px solid var(--border)}
.app-head img{height:26px}
.bell{position:relative;min-width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;font:600 var(--fs-14)/1 var(--font-sans);color:var(--text)}
.bell i{background:var(--loss);color:#fff;border-radius:var(--r-pill);font:600 11px/1 var(--font-sans);padding:3px 6px;font-style:normal}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.mono{font-family:ui-monospace,"IBM Plex Mono",Menlo,Consolas,monospace}
h1{font-size:var(--fs-22);margin:0;line-height:var(--lh-tight)}
h2{font-size:var(--fs-14);margin:0;font-weight:var(--fw-semibold)}
.muted{color:var(--text-muted);font-size:var(--fs-14)}
.chip{display:inline-flex;align-items:center;border-radius:var(--r-pill);padding:2px 10px;font-size:var(--fs-12);font-weight:var(--fw-semibold);white-space:nowrap}
.c-draft{background:var(--surface-sunken);color:var(--text-muted)}
.c-review{background:var(--info-bg);color:var(--info)}
.c-action{background:var(--warning-bg);color:var(--warning)}
.c-live{background:var(--action-subtle-hover);color:var(--green-800)}
.c-done{background:var(--gain-bg);color:var(--gain)}
.btn{min-height:var(--tap);border-radius:var(--r-btn);border:1px solid var(--action);background:var(--action);color:var(--on-action);font:600 var(--fs-14)/1 var(--font-sans);padding:0 var(--sp-4);cursor:pointer;transition:transform var(--dur-instant)}
.btn.ghost{background:none;color:var(--action)}
.btn.gold{background:var(--gold-300);border-color:var(--gold-300);color:var(--green-950)}
.btn.sm{min-height:36px;padding:0 var(--sp-3)}
.btn:active{transform:scale(var(--press-scale))}
:is(.btn,.bell,.pbar button,.pbar select,.cont,.stub button):focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.tabs{position:sticky;bottom:0;display:flex;background:var(--surface-card);box-shadow:var(--shadow-nav);height:var(--nav-h);z-index:5}
.tabs span{flex:1;display:grid;place-items:center;font-size:var(--fs-12);color:var(--text-muted)}
.tabs span.on{color:var(--green-800);font-weight:700}
.gate{margin:var(--gutter);background:var(--surface-accent-subtle);border:1px solid var(--accent);border-radius:var(--r-md);padding:var(--sp-4)}
.rise{opacity:0;transform:translateY(var(--move-small));animation:rise var(--dur-base) var(--ease-enter) forwards;animation-delay:min(calc(var(--i,0)*var(--stagger)),var(--stagger-max))}
@keyframes rise{to{opacity:1;transform:none}}

/* ============ A: THE YARD ============ */
.yard-hero{background:var(--surface-brand-deep);color:var(--text-on-brand);padding:var(--sp-6) var(--gutter) var(--sp-4);position:relative;overflow:hidden}
.yard-hero:after{content:"";position:absolute;inset-inline:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,transparent 18px 26px)}
.yard-hero .cap{color:var(--green-200);font-size:var(--fs-14)}
.yard-hero .big{font-size:var(--fs-44);font-weight:var(--fw-bold);line-height:var(--lh-tight);letter-spacing:-.01em}
.slots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-block:var(--sp-3) var(--sp-2)}
.slots i{height:16px;border-radius:2px;background:rgb(255 255 255/.12);transform-origin:bottom}
.slots i.on{background:var(--gold-300);animation:drop var(--dur-slow) var(--ease-grow) both;animation-delay:min(calc(var(--i)*30ms),600ms)}
.slots i.on.hot{background:var(--warning-bg)}
@keyframes drop{from{transform:translateY(-14px) scaleY(.4);opacity:0}}
.ticker{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-3) var(--gutter) 0;padding:var(--sp-3) var(--sp-4);background:var(--surface-accent-subtle);border:1px solid var(--accent);border-radius:var(--r-md);cursor:pointer;font:600 var(--fs-14)/1.3 var(--font-sans);color:var(--text);width:calc(100% - 2*var(--gutter));text-align:start}
.ticker b{font-size:var(--fs-28);line-height:1;color:var(--text-accent)}
.yard{display:grid;grid-auto-flow:dense;grid-template-columns:1fr 1fr;gap:var(--sp-4) var(--sp-3);padding:var(--sp-6) var(--gutter) var(--sp-8);background:
  linear-gradient(var(--surface-sunken),var(--surface-page) 140px)}
.cont{--door:var(--door-green);grid-column:span 1;position:relative;border:0;padding:0;text-align:start;cursor:pointer;color:#fff;font:inherit;background:none;animation:lower var(--dur-spring) var(--ease-spring) both;animation-delay:min(calc(var(--i)*var(--stagger)*2),520ms)}
.cont.long{grid-column:span 2}
@keyframes lower{from{transform:translateY(-36px);opacity:0}}
.cont .box{display:flex;flex-direction:column;justify-content:space-between;min-height:132px;border-radius:var(--r-sm);padding:var(--sp-3);background:
  repeating-linear-gradient(90deg,rgb(0 0 0/.16) 0 3px,transparent 3px 11px),
  linear-gradient(180deg,rgb(255 255 255/.14),transparent 20%,rgb(0 0 0/.18)),var(--door);
  box-shadow:inset 0 0 0 2px rgb(0 0 0/.18),0 6px 0 -2px var(--surface-sunken),0 7px 0 -2px var(--border);transition:transform var(--dur-fast) var(--ease-standard)}
.cont:hover .box{transform:translateY(-3px)}
.cont .plate{display:flex;justify-content:space-between;font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;opacity:.92}
.cont .name{background:rgb(0 0 0/.34);padding:6px 8px;border-radius:var(--r-sm);font-weight:var(--fw-semibold);font-size:var(--fs-14);line-height:1.25;margin-block:var(--sp-2)}
.cont .foot{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-12);gap:6px}
.cont .foot .chip{background:rgb(255 255 255/.94);color:var(--text)}
.cont .prog{display:block;height:4px;background:rgb(0 0 0/.3);border-radius:2px;margin-top:6px;overflow:hidden}
.cont .prog i{display:block;height:100%;background:var(--gold-300);width:0;transition:width var(--dur-deliberate) var(--ease-standard) .3s}
.cont.ghosted .box{opacity:.78;background:
  repeating-linear-gradient(90deg,rgb(255 255 255/.5) 0 3px,transparent 3px 11px),var(--door);outline:2px dashed rgb(255 255 255/.6);outline-offset:-6px}
.cont .tag{position:absolute;inset-block-start:-14px;inset-inline-end:10px;background:var(--gold-300);color:var(--green-950);font:700 var(--fs-12)/1.2 var(--font-sans);padding:6px 10px 6px 12px;border-radius:var(--r-sm);box-shadow:0 2px 0 var(--gold-600);transform-origin:top right;animation:swing 2.4s var(--ease-spring-soft) 1s 2 both}
.cont .tag.late{background:var(--loss-bg);color:var(--loss);box-shadow:0 2px 0 var(--loss)}
.cont .tag:before{content:"";position:absolute;inset-block-start:-8px;inset-inline-end:14px;width:2px;height:8px;background:var(--stone-500)}
@keyframes swing{0%{transform:rotate(-7deg)}40%{transform:rotate(5deg)}100%{transform:rotate(0)}}
.cont.pulse .box{animation:flash 1.1s ease 2}
@keyframes flash{50%{box-shadow:inset 0 0 0 3px var(--gold-300),0 0 0 4px var(--gold-300)}}
.add{grid-column:span 1;min-height:132px;border:2px dashed var(--border-input);border-radius:var(--r-sm);background:none;color:var(--text-muted);font:600 var(--fs-14)/1.3 var(--font-sans);cursor:pointer}
.yard-empty{grid-column:span 2;text-align:center;padding:var(--sp-8) var(--sp-4);color:var(--text-muted)}

/* ============ B: VOYAGE MAP ============ */
.sea{background:var(--surface-brand-deep);position:relative;color:#fff;background-image:radial-gradient(rgb(255 255 255/.1) 1px,transparent 1.2px);background-size:16px 16px}
.sea svg{display:block;width:100%;height:auto}
.sea .top{position:absolute;inset-block-start:0;inset-inline:0;padding:var(--sp-4) var(--gutter);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.sea .top .cap{color:var(--green-200);font-size:var(--fs-12)}
.sea .top .big{font-size:var(--fs-28);font-weight:var(--fw-bold);line-height:1.1}
.route-base{fill:none;stroke:var(--green-200);stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:3 5}
.route-prog{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--gold-300)}
.route-solid{fill:none;stroke:var(--gold-300);stroke-width:1.6;stroke-opacity:.9}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawn var(--dur-showpiece) var(--ease-standard) forwards;animation-delay:calc(var(--i)*120ms + 200ms)}
.route-prog.draw{stroke-dasharray:var(--f) 2;stroke-dashoffset:var(--f)}
@keyframes drawn{to{stroke-dashoffset:0}}
.node{cursor:pointer;outline:none}
.node circle.dot{fill:var(--green-100);stroke:var(--surface-brand-deep);stroke-width:2}
.node.sel circle.dot{fill:var(--gold-300)}
.node .halo{fill:none;stroke:var(--gold-300);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.node .halo.late{stroke:var(--loss-bg)}
@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.node text{font:600 11px var(--font-sans);fill:#fff;paint-order:stroke;stroke:var(--surface-brand-deep);stroke-width:3px}
.node:focus-visible circle.dot{stroke:#fff}
.origin text{font:700 12px var(--font-sans);fill:var(--gold-300);paint-order:stroke;stroke:var(--surface-brand-deep);stroke-width:3px}
.vessel{fill:var(--accent);stroke:var(--surface-brand-deep);stroke-width:2}
.flyout{margin:-72px var(--gutter) 0;position:relative;z-index:2;background:var(--surface-card);border-radius:var(--r-md);padding:var(--sp-4);box-shadow:var(--shadow-dialog);min-height:132px}
.flyout .between{display:flex;justify-content:space-between;gap:var(--sp-2);align-items:flex-start}
.flyout .act{margin-top:var(--sp-3);display:flex;gap:var(--sp-3);align-items:center;background:var(--warning-bg);color:var(--warning);padding:var(--sp-3);border-radius:var(--r-md);font-weight:var(--fw-semibold);font-size:var(--fs-14)}
.flyout .act .btn{margin-inline-start:auto}
.flyout.swap{animation:rise var(--dur-fast) var(--ease-enter)}
.gauge-wrap{display:flex;gap:var(--sp-4);align-items:center;padding:var(--sp-6) var(--gutter) var(--sp-4)}
.hull{width:150px;height:84px;flex:none;position:relative;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);background:var(--surface-sunken)}
.hull .water{position:absolute;inset-inline:0;bottom:0;height:0;background:linear-gradient(var(--green-600),var(--green-800));transition:height var(--dur-showpiece) var(--ease-count)}
.hull .water.warn{background:linear-gradient(var(--warning),#6b2608)}
.hull .mark{position:absolute;inset-inline:0;height:0;border-top:2px dashed var(--text);bottom:80%}
.rowlist{padding:0 var(--gutter) var(--sp-8);display:flex;flex-direction:column}
.rowlist button{display:flex;align-items:center;gap:var(--sp-3);min-height:56px;border:0;border-block-start:1px solid var(--border);background:none;text-align:start;font:inherit;color:inherit;cursor:pointer;padding:var(--sp-2) 0}
.rowlist button:first-child{border-block-start:0}

/* ============ C: MANIFEST ============ */
.paper{background:var(--surface-sunken);padding:var(--sp-4) var(--gutter) var(--sp-8);min-height:calc(844px - 120px)}
.mast{display:flex;justify-content:space-between;font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;color:var(--text-muted);border-block-end:2px solid var(--text);padding-block-end:var(--sp-2)}
.huge{display:flex;align-items:flex-end;gap:var(--sp-3);padding-block:var(--sp-4) var(--sp-2)}
.huge .n{font-size:96px;font-weight:var(--fw-bold);line-height:.85;letter-spacing:-.04em;color:var(--green-800)}
.huge .n sup{font-size:34px;letter-spacing:0;vertical-align:top;position:relative;inset-block-start:6px}
.huge .t{padding-block-end:8px;font-size:var(--fs-14);color:var(--text-muted)}
.rule{height:10px;background:var(--surface-card);border:1px solid var(--text);position:relative;margin-block-end:var(--sp-6)}
.rule i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:repeating-linear-gradient(135deg,var(--green-800) 0 5px,var(--green-700) 5px 10px);transition:width var(--dur-showpiece) var(--ease-count)}
.rule b{position:absolute;inset-block-start:-5px;inset-inline-start:80%;width:2px;height:18px;background:var(--text)}
.sect{display:flex;align-items:baseline;gap:var(--sp-3);margin-block:var(--sp-4) var(--sp-3)}
.sect:after{content:"";flex:1;border-block-start:1px dashed var(--stone-500)}
.stub{display:flex;background:var(--surface-card);margin-block-end:var(--sp-3);position:relative;filter:drop-shadow(0 1px 0 var(--sand-300));
  -webkit-mask:radial-gradient(circle 8px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 8px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.stub .cd{width:92px;flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:var(--sp-3) var(--sp-2);border-inline-end:2px dashed var(--sand-300);background:var(--warning-bg);color:var(--warning)}
.stub.late .cd{background:var(--loss-bg);color:var(--loss)}
.stub .cd strong{font-size:var(--fs-34);line-height:1;font-weight:var(--fw-bold)}
.stub .cd span{font-size:var(--fs-12);font-weight:var(--fw-semibold)}
.stub .bd{flex:1;padding:var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-1);min-width:0}
.stub .bd b{line-height:1.25}
.stub button{align-self:flex-start;margin-top:var(--sp-1)}
.stamp{display:inline-block;transform:rotate(-6deg);border:2px solid currentColor;border-radius:var(--r-sm);padding:1px 6px;font:700 11px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase}
.stamp.pop{animation:stamp var(--dur-base) var(--ease-grow) both;animation-delay:min(calc(var(--i)*60ms + 500ms),1200ms)}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}}
.ledger button{display:grid;grid-template-columns:auto 1fr auto;gap:2px var(--sp-3);width:100%;text-align:start;border:0;background:none;border-block-end:1px dashed var(--stone-400);padding:var(--sp-3) 0;font:inherit;color:inherit;cursor:pointer;align-items:center}
.ledger .cn{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--text-muted);grid-row:span 2}
.ledger .nm{font-weight:var(--fw-semibold);line-height:1.25}
.ledger .am{text-align:end;font-weight:var(--fw-semibold)}
.ledger .gain{color:var(--gain);font-weight:var(--fw-semibold);font-size:var(--fs-14)}
.cta-wide{width:100%;margin-top:var(--sp-6)}


/* ============ D: CALM (after docs/refer reference) ============ */
.calm{background:var(--surface-page);padding:var(--sp-4) var(--gutter) 0;min-height:calc(844px - var(--nav-h))}
.calm .hi{display:flex;justify-content:space-between;align-items:center;padding-block:var(--sp-2) var(--sp-4)}
.calm .hi h1{font-size:var(--fs-34);font-weight:var(--fw-bold);letter-spacing:-.02em;line-height:1.05}
.calm .hi .sub{color:var(--text-muted);font-size:var(--fs-14)}
.round{width:var(--tap);height:var(--tap);border-radius:50%;border:0;background:var(--green-900);color:#fff;display:grid;place-items:center;font:700 var(--fs-16)/1 var(--font-sans);cursor:pointer;position:relative;flex:none;transition:transform var(--dur-instant)}
.round:active{transform:scale(var(--press-scale))}
.round.sm{width:36px;height:36px}
.round .dot{position:absolute;inset-block-start:8px;inset-inline-end:8px;width:9px;height:9px;border-radius:50%;background:var(--gold-300);border:2px solid var(--green-900)}
.search{display:flex;align-items:center;gap:var(--sp-2);background:#fff;border-radius:var(--r-pill);padding:0 var(--sp-4);height:48px;margin-bottom:var(--sp-4);box-shadow:0 1px 0 var(--border)}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:var(--fs-16);background:none;color:var(--text);min-width:0}
.search:focus-within{box-shadow:0 0 0 3px var(--focus-ring)}
.search input::placeholder{color:var(--text-muted)}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.heroes.one{grid-template-columns:1fr}
.hero{border-radius:calc(var(--r-lg)*1.5);padding:var(--sp-4);min-height:176px;display:flex;flex-direction:column;justify-content:space-between;background:#fff;text-align:start;border:0;font:inherit;color:var(--text);cursor:pointer;transition:transform var(--dur-fast) var(--ease-standard)}
.hero:hover{transform:translateY(-3px)}
.hero.dark{background:var(--green-900);color:#fff}
.hero.late{background:var(--loss-bg)}
.hero .t{font-size:var(--fs-22);font-weight:var(--fw-semibold);line-height:1.15;letter-spacing:-.01em}
.hero .s{font-size:var(--fs-12);opacity:.75;margin-top:6px}
.hero .ft{display:flex;align-items:center;justify-content:space-between;background:rgb(0 0 0/.06);border-radius:var(--r-pill);padding:4px 4px 4px var(--sp-3);font-size:var(--fs-12);font-weight:var(--fw-semibold)}
.hero.dark .ft{background:rgb(255 255 255/.1)}
.hero .ft .round{background:var(--gold-300);color:var(--green-950)}
.hero:not(.dark) .ft .round{background:var(--green-100);color:var(--green-900)}
.chips{display:flex;gap:var(--sp-2);overflow-x:auto;padding-bottom:var(--sp-4);margin-inline:calc(var(--gutter)*-1);padding-inline:var(--gutter);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:var(--tap);padding:0 var(--sp-4);border-radius:var(--r-pill);border:0;background:var(--green-900);color:#fff;font:600 var(--fs-14)/1 var(--font-sans);cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-instant)}
.fchip:active{transform:scale(var(--press-scale))}
.fchip.on{background:var(--gold-300);color:var(--green-950)}
.fchip span{opacity:.7;margin-inline-start:6px;font-weight:500}
.sheet{background:#fff;border-radius:calc(var(--r-lg)*1.5) calc(var(--r-lg)*1.5) 0 0;margin-inline:calc(var(--gutter)*-1);padding:var(--sp-2) var(--gutter) var(--sp-6);box-shadow:var(--shadow-sheet)}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--border);margin:var(--sp-2) auto var(--sp-4)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-3)}
.sheet .hd h2{font-size:var(--fs-22);font-weight:var(--fw-bold);letter-spacing:-.01em}
.sheet .hd a{font-size:var(--fs-14);color:var(--text-muted)}
.pcard{display:flex;align-items:center;gap:var(--sp-3);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-3);animation:rise var(--dur-base) var(--ease-enter) both;animation-delay:min(calc(var(--i)*var(--stagger)),var(--stagger-max));border:1px solid transparent}
.pcard .tx{flex:1;min-width:0}
.pcard b{display:block;font-size:var(--fs-16);line-height:1.25;margin-bottom:var(--sp-2)}
.pcard .pills{display:flex;gap:6px;flex-wrap:wrap}
.pcard .pill{background:rgb(255 255 255/.75);border-radius:var(--r-pill);padding:3px 10px;font-size:var(--fs-12);font-weight:var(--fw-medium)}
.pcard .bar2{height:4px;border-radius:2px;background:rgb(0 0 0/.08);margin-top:var(--sp-2);overflow:hidden}
.pcard .bar2 i{display:block;height:100%;background:var(--green-800);width:0;border-radius:2px;transition:width var(--dur-deliberate) var(--ease-standard) .2s}

.quote{background:var(--green-900);color:#fff;border-radius:calc(var(--r-lg)*1.5);padding:var(--sp-4) var(--sp-4) var(--sp-3);margin-top:var(--sp-4)}

/* ---- E: GLASS (green glass reference, brand greens + gold) ---- */
.phone.glassy{background:
  radial-gradient(420px 320px at 88% 6%,rgb(217 194 138/.42),transparent 70%),
  radial-gradient(380px 320px at -8% 26%,rgb(19 128 94/.9),transparent 72%),
  linear-gradient(180deg,var(--green-800) 0,var(--green-700) 200px,var(--green-600) 420px,var(--green-200) 900px,var(--green-100) 100%);
  color:var(--ink-900)}
.gl{--navb:62px;padding:var(--sp-6) var(--gutter) 84px;display:flex;flex-direction:column;gap:var(--sp-4);min-height:844px}
.glass{background:linear-gradient(145deg,rgb(255 255 255/.74),rgb(255 255 255/.4));border:1px solid rgb(255 255 255/.6);border-radius:var(--r-lg);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  box-shadow:0 10px 30px rgb(3 37 26/.16),inset 0 1px 0 rgb(255 255 255/.7)}
.glass.dk{background:linear-gradient(145deg,rgb(255 255 255/.2),rgb(255 255 255/.07));border-color:rgb(255 255 255/.38);color:#fff;box-shadow:0 10px 30px rgb(3 37 26/.28),inset 0 1px 0 rgb(255 255 255/.4)}
@supports not (backdrop-filter:blur(1px)){.glass{background:rgb(255 255 255/.82)}.glass.dk{background:rgb(3 48 31/.7)}}
@media (prefers-reduced-transparency:reduce){.glass{background:#fff;backdrop-filter:none}.glass.dk{background:var(--green-900);backdrop-filter:none}}
.gl .hi{display:flex;justify-content:space-between;align-items:center;color:#fff}
.gl .hi .g1{font-size:var(--fs-18);opacity:.9}
.gl .hi h1{font-size:var(--fs-34);font-weight:var(--fw-medium);letter-spacing:-.01em}
.gl .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--green-900);background:linear-gradient(135deg,var(--gold-300),var(--green-200));border:3px solid rgb(255 255 255/.75);box-shadow:0 4px 14px rgb(3 37 26/.3);position:relative}
.gl .av i{position:absolute;top:-2px;inset-inline-end:-2px;width:14px;height:14px;border-radius:50%;background:var(--loss);border:2px solid #fff}
.gl .sum{display:grid;grid-template-columns:136px 1fr;gap:var(--sp-4);align-items:center;padding:var(--sp-4)}
.ring{position:relative;width:136px;height:136px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:rgb(255 255 255/.22);stroke-width:12}
.ring .pg{fill:none;stroke:url(#rg);stroke-width:12;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset var(--dur-showpiece) var(--ease-count) .2s}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .mid small{font-size:var(--fs-12);opacity:.85}
.ring .mid b{font-size:var(--fs-28);font-weight:var(--fw-medium)}
.sts{display:grid;gap:0}
.sts div{display:flex;align-items:center;gap:var(--sp-3);padding:9px 0;border-block-end:1px solid rgb(255 255 255/.2)}
.sts div:last-child{border:0}
.sts .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.18);border:1px solid rgb(255 255 255/.4);font-size:13px;flex:none}
.sts span{font-size:var(--fs-14);line-height:1.2}
.sts small{display:block;font-size:var(--fs-12);opacity:.78}
.gl .card{padding:var(--sp-4)}
.gl .cap{display:flex;justify-content:space-between;align-items:baseline;margin-block-end:var(--sp-2)}
.gl .cap h2{font-size:var(--fs-18);font-weight:var(--fw-medium)}
.gl .cap a{font-size:var(--fs-14);color:var(--green-800);font-weight:600}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:flex;align-items:center;gap:var(--sp-3);padding:12px 0;border-block-end:1px solid rgb(20 35 28/.1);min-height:var(--tap);cursor:pointer}
.tl li:last-child{border:0}
.tl .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--stone-400);flex:none;background:rgb(255 255 255/.7);position:relative;z-index:1}
.tl li:first-child .dot{border-color:var(--gold-500);background:var(--gold-300);box-shadow:0 0 0 4px rgb(217 194 138/.35)}
.tl li.late .dot{border-color:var(--loss);background:var(--loss-bg)}
.tl li:not(:last-child) .dot::after{content:"";position:absolute;inset-inline-start:6px;top:20px;height:calc(100% + 18px);width:2px;background:rgb(20 35 28/.14);z-index:-1}
.tl b{display:block;font-weight:var(--fw-medium);font-size:var(--fs-16);line-height:1.2}
.tl small{font-size:var(--fs-12);color:var(--ink-900);opacity:.78}
.tl small.lt{color:var(--loss);font-weight:600}
.tl .go{margin-inline-start:auto;color:var(--stone-600);font-size:20px}
.go-btn{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);width:100%;min-height:52px;margin-block-start:var(--sp-3);border:0;border-radius:var(--r-pill);cursor:pointer;font:600 var(--fs-16)/1 var(--font-sans);color:var(--green-950);
  background:linear-gradient(90deg,var(--gold-300),var(--green-200));box-shadow:0 6px 18px rgb(3 37 26/.2),inset 0 1px 0 rgb(255 255 255/.7);transition:transform var(--dur-instant)}
.go-btn:active{transform:scale(var(--press-scale))}
.tiles{display:flex;gap:var(--sp-3);overflow-x:auto;scroll-snap-type:x proximity;margin-inline:calc(var(--gutter)*-1);padding:2px var(--gutter) var(--sp-3);scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:148px;scroll-snap-align:start;padding:var(--sp-3);display:flex;flex-direction:column;gap:2px;min-height:168px;border-radius:var(--r-lg);animation:rise var(--dur-base) var(--ease-enter) both;animation-delay:min(calc(var(--i,0)*var(--stagger)),var(--stagger-max))}
.tile .gx{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--green-800);background:rgb(255 255 255/.7);border:1px solid rgb(255 255 255/.9);margin-block-end:var(--sp-2)}
.tile b{font-weight:var(--fw-medium);line-height:1.2}
.tile small{color:var(--text-muted);font-size:var(--fs-12)}
.tile .am{margin-block-start:auto;font-size:var(--fs-14);font-weight:600}
.tile .row{display:flex;justify-content:space-between;align-items:end;margin-block-start:auto}
.tile .ar{width:32px;height:32px;border-radius:50%;border:1px solid rgb(255 255 255/.9);background:rgb(255 255 255/.75);display:grid;place-items:center;color:var(--green-800);font-size:18px}
.tile.need{box-shadow:0 10px 30px rgb(3 37 26/.16),inset 0 0 0 2px var(--gold-500)}
.wk{display:grid;grid-template-columns:1fr 120px;gap:var(--sp-3);align-items:stretch}
.wk .gr{padding:var(--sp-3) var(--sp-4)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px;margin-block-start:var(--sp-2)}
.bars i{display:block;border-radius:var(--r-pill);background:linear-gradient(180deg,var(--gold-300),var(--green-600));height:0;transition:height var(--dur-deliberate) var(--ease-enter)}
.bars i:last-child{box-shadow:0 0 0 2px rgb(255 255 255/.8)}
.bl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:10px;color:var(--text-muted);text-align:center;margin-block-start:4px}
.wk .st{padding:var(--sp-3);display:flex;flex-direction:column;gap:4px;justify-content:center;font-size:var(--fs-12);color:var(--text-muted)}
.wk .st b{font-size:var(--fs-18);color:var(--ink-900);font-weight:var(--fw-medium);line-height:1.15}
.nav3{position:sticky;bottom:var(--navb,62px);margin-block-start:auto;display:flex;gap:4px;padding:6px;border-radius:var(--r-pill);z-index:5;margin-block-end:var(--sp-3)}
.nav3 span{flex:1;min-height:var(--tap);border-radius:var(--r-pill);display:grid;place-items:center;color:var(--stone-600);font-size:var(--fs-12);font-weight:600}
.nav3 span.on{background:#fff;color:var(--green-800);box-shadow:0 4px 12px rgb(3 37 26/.14)}
.gl .gate{margin:0}
.gl .empty{text-align:center;padding:var(--sp-6) var(--sp-4);color:var(--text-muted)}

/* ---- P: GLASS FOCUS (E's glass, one hero action, stat chips, listing rows with progress) ---- */
.pf{display:flex;gap:var(--sp-2)}
.pf .glass{flex:1;padding:var(--sp-3);display:flex;flex-direction:column;gap:2px;font-size:var(--fs-12);color:var(--text-muted);border-radius:var(--r-lg)}

.hero-a{padding:var(--sp-5) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2)}

.lrow{display:grid;grid-template-columns:1fr auto;gap:2px var(--sp-3);padding:12px 0;border-block-end:1px solid rgb(20 35 28/.1);min-height:var(--tap)}

.lrow b{font-weight:var(--fw-medium)}
.lrow small{color:var(--text-muted);font-size:var(--fs-12)}

.lrow.a b::after{content:"";display:inline-block;width:8px;height:8px;margin-inline-start:8px;border-radius:50%;background:var(--gold-500)}

/* ---- F: GLASS DARK (same markup as E, dark surface, gold highlights) ---- */
.phone.glassy.dark{color:#fff;background:
  radial-gradient(380px 300px at 90% 4%,rgb(179 145 68/.34),transparent 70%),

  linear-gradient(180deg,var(--green-900) 0,var(--green-950) 100%)}

.dark .glass.dk{background:linear-gradient(145deg,rgb(255 255 255/.18),rgb(255 255 255/.06))}
@supports not (backdrop-filter:blur(1px)){.dark .glass{background:rgb(6 80 58/.9)}}

.dark .cap,.dark .cap h2{color:#fff!important}
.dark .gl .cap a{color:var(--gold-300)}

/* ---- G: LEDGER MONO (Linear / Stripe style: flat, hairlines, tabular figures, one accent) ---- */
.led{background:var(--surface-card);min-height:780px;padding-block-end:24px}

@keyframes segin{from{transform:scaleX(0)}}
.led .s-act{background:var(--gold-500)}.led .s-fund{background:var(--green-600)}.led .s-run{background:var(--green-800)}.led .s-free{background:var(--sand-300)}

.led .two{display:grid;grid-template-columns:1fr 1fr;border-block-end:1px solid var(--border)}

.led .hd{display:flex;justify-content:space-between;align-items:center}
.led .hd a{font-size:var(--fs-12);font-weight:600;color:var(--action)}
.led .tbl{margin-block-start:var(--sp-2)}
.led .tr{display:grid;grid-template-columns:1fr 104px 74px;gap:8px;align-items:center;min-height:var(--tap);padding-block:8px;border-block-start:1px solid var(--border)}
.led .tr.h{min-height:28px;padding-block:6px;font:600 11px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}

.led .tr small{font-size:var(--fs-12);color:var(--text-muted)}
.led .tr .stt{font-size:var(--fs-12);color:var(--text)}

@media (prefers-reduced-motion:reduce){.led .seg i{animation:none}}

/* ---- H: BENTO BOARD (Apple widgets / Notion: mixed-size tinted tiles, one radius) ---- */

.bt.need li small{font-size:var(--fs-12);color:var(--text-muted)}

.bt.lst .stx.a{color:var(--warning);font-weight:700}
.bt.lst .amt{display:block;font:700 var(--fs-18)/1 var(--font-sans);margin-block-start:10px}
.bt.lst .pb{display:block;height:4px;border-radius:99px;background:rgb(0 0 0/.08);margin-block-start:10px;overflow:hidden}

<body>
<div class="stage"><div class="phone" id="phone"></div></div>
<div class="pbar" id="pbar" hidden></div>

<script>
/* ---------- seed: Emirates Spice Traders LLC, a UAE manager (PLAN section 4 used Al Noor; moved to the UAE). Cents, as the real app. ---------- */
const USD = c => '$' + (c/100).toLocaleString('en-US',{maximumFractionDigits:0});
const D = n => n*100;
const KERALA = {
  status:'approved', name:'Emirates Spice Traders LLC', wallet:D(60000), limit:D(500000), notif:4,
  listings:[
    {id:1,name:'Cardamom to Hamburg',dest:'Hamburg',st:'deposit',target:D(100000),deposit:D(20000),dayLeft:2,flag:'Sourced in Egypt, shipped via Jebel Ali, sold in Germany'},
    {id:2,name:'Basmati to Mombasa',dest:'Mombasa',st:'revised',target:D(70000),flag:'Investor share changed from 50% to 55%'},
    {id:3,name:'Dates to Rotterdam',dest:'Rotterdam',st:'funding',target:D(80000),raised:D(51200),flag:'64% funded by 9 investors'},
    {id:4,name:'Black pepper to Genoa',dest:'Genoa',st:'running',target:D(150000),stage:3,stages:6,late:true,myStep:'Upload bill of lading',myStepDue:'Due tomorrow',flag:'Shipment 2 customs clearance is 3 days late'},
    {id:5,name:'Turmeric to Jeddah',dest:'Jeddah',st:'review',target:D(80000),flag:'With reviewer Noura A.'},
    {id:6,name:'Tea to London',dest:'London',st:'draft',target:D(60000),flag:'Step plan not finished'},
    {id:7,name:'Cashew to Muscat',dest:'Muscat',st:'done',target:D(70000),result:8.4,flag:'Settled, your share paid to wallet'}
  ]
};
const WORLDS = {
  busy:KERALA,
  empty:{...KERALA,name:'Fresh Manager Co.',wallet:0,notif:0,listings:[]},
  pending:{...KERALA,status:'pending',name:'Tariq Al-Masri',wallet:0,notif:1,listings:[]}
};
const ST = {
  draft:['Draft','c-draft'], review:['In review','c-review'], revised:['Action needed','c-action'], deposit:['Deposit due','c-action'],
  funding:['Live, funding','c-live'], running:['Live, running','c-live'], done:['Completed','c-done']
};
const DOORS = ['--door-green','--door-gold','--door-clay','--door-olive','--door-teal','--door-umber'];

function derive(w){
  const used = w.listings.filter(l => ['deposit','revised','funding','running'].includes(l.st)).reduce((s,l)=>s+l.target,0);
  const actions = [];
  w.listings.forEach(l=>{
    if(l.st==='revised') actions.push({kind:'Respond to revised terms',short:'Revised terms',l,cta:'Review changes',sev:1,when:'Now',n:'!',unit:'now'});
    if(l.st==='deposit') actions.push({kind:'Pay the deposit of '+USD(l.deposit),short:'Pay '+USD(l.deposit)+' in '+l.dayLeft+'d',l,cta:'Pay from wallet',sev:l.dayLeft<=2?2:1,when:l.dayLeft+' days left',n:l.dayLeft,unit:'days left',wallet:w.wallet<l.deposit?l.deposit-w.wallet:0});
    if(l.st==='running' && l.late) actions.push({kind:'Step running late',short:'Step late',l,cta:'View step',sev:3,when:'Late',n:'3',unit:'days late',late:true});
    if(l.st==='running' && l.myStep) actions.push({kind:'Your step: '+l.myStep,short:l.myStep,l,cta:'Open step',sev:1,when:l.myStepDue,n:'1',unit:'day left'});
  });
  actions.sort((a,b)=>b.sev-a.sev);
  const count = k => w.listings.filter(l=>l.st===k).length;
  return {used,actions,count,pct:Math.round(used/w.limit*100),live:count('funding')+count('running')};
}
const chip = l => `<span class="chip ${ST[l.st][1]}">${ST[l.st][0]}</span>`;
const cno = l => 'KSTU 48'+(20+l.id*7)+' '+(l.id+2);
const countUp = (el,to,fmt) => {
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=fmt(to);return}
  const t0=performance.now(); (function f(t){const p=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-p,4);el.textContent=fmt(Math.round(to*e));if(p<1)requestAnimationFrame(f)})(t0);
};
const header = w => `<div class="app-head"><img src="../../Demo/frontend/brand/lockup.svg" alt="Shehnat"><button class="bell" aria-label="Notifications">Alerts${w.notif?`<i>${w.notif}</i>`:''}</button></div>`;
const tabs = `<nav class="tabs"><span class="on">Home</span><span>My listings</span><span>Wallet</span><span>Profile</span></nav>`;
const gate = `<div class="gate rise"><b>Almost there</b><p class="muted" style="margin:4px 0 12px">Your registration is being reviewed by our team. You can create Listings as soon as it is approved, usually within 1 to 2 working days.</p><button class="btn ghost sm">View registration status</button></div>`;

/* ================= A: THE YARD ================= */
function VariantA(w,d){
  if(w.status==='pending') return gate;
  const filled = Math.round(d.pct/5);
  const slots = Array.from({length:20},(_,i)=>`<i class="${i<filled?'on':''} ${i<filled&&d.pct>80?'hot':''}" style="--i:${i}"></i>`).join('');
  const n = d.actions.length;
  const order = w.listings.slice().sort((a,b)=>(d.actions.some(x=>x.l===b)?1:0)-(d.actions.some(x=>x.l===a)?1:0));
  const conts = order.map((l,i)=>{
    const a = d.actions.find(x=>x.l===l);
    const long = l.target>=D(100000);
    const ghost = ['draft','review'].includes(l.st);
    const pr = l.st==='funding'?Math.round(l.raised/l.target*100): l.st==='running'?Math.round(l.stage/l.stages*100):0;
    const right = l.st==='done' ? `<b>▲ +${l.result}%</b>` : `<span class="num">${USD(l.target)}</span>`;
    return `<button class="cont ${long?'long':''} ${ghost?'ghosted':''}" data-act="${a?1:0}" style="--door:var(${DOORS[l.id%6]});--i:${i}" aria-label="${l.name}">
      ${a?`<span class="tag ${a.late?'late':''}">${a.short}</span>`:''}
      <span class="box"><span class="plate"><span class="mono">${cno(l)}</span><span>${long?'40 FT':'20 FT'}</span></span>
      <span class="name">${l.name}</span>
      <span><span class="foot">${chip(l)}${right}</span>${pr?`<span class="prog"><i data-w="${pr}"></i></span>`:''}</span></span></button>`;
  }).join('');
  return `
  <div class="yard-hero">
    <div class="cap rise" style="--i:0">${w.name}</div>
    <div class="big num rise" style="--i:1" data-up="${w.wallet}">${USD(w.wallet)}</div>
    <div class="cap rise" style="--i:2">in your wallet</div>
    <div class="slots" aria-hidden="true">${slots}</div>
    <div class="between" style="display:flex;justify-content:space-between;font-size:var(--fs-14)"><span class="cap">Yard in use</span><b class="num">${d.pct}% of ${USD(w.limit)}</b></div>
  </div>
  ${n?`<button class="ticker rise" style="--i:3" id="gate"><b>${n}</b><span>${n===1?'container is':'containers are'} waiting for you.<br><span class="muted">Tap to find them in the yard</span></span></button>`:''}
  <div class="yard">${conts || `<div class="yard-empty">The yard is empty.<br>Your first container will land here.</div>`}
    <button class="add">+ New Listing<br><span class="muted">start an empty container</span></button></div>`;
}

/* ================= B: VOYAGE MAP ================= */
const PLACES = {'Jebel Ali':[200,392],London:[52,96],Rotterdam:[118,58],Hamburg:[196,44],Genoa:[258,112],Jeddah:[52,244],Mombasa:[148,214],Muscat:[262,262]};
function arc(from,to){
  const [x1,y1]=PLACES[from],[x2,y2]=PLACES[to];
  const mx=(x1+x2)/2,my=(y1+y2)/2, dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
  const cx=mx+(-dy/len)*len*.28, cy=my+(dx/len)*len*.28;
  return `M${x1},${y1} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2},${y2}`;
}
let selected = null;
function VariantB(w,d){
  if(w.status==='pending') return gate;
  const ls = w.listings;
  if(!ls.some(l=>l.id===selected)) selected = (d.actions[0]||{}).l ? d.actions[0].l.id : (ls[0]||{}).id;
  const paths = ls.map((l,i)=>{
    const p = arc('Jebel Ali',l.dest);
    const prog = l.st==='funding'? l.raised/l.target : l.st==='running'? l.stage/l.stages : 0;
    return `<path class="route-base" d="${p}"/>`+
      (l.st==='done'?`<path class="route-solid draw" style="--i:${i}" pathLength="1" d="${p}"/>`:'')+
      (prog?`<path class="route-prog draw" style="--i:${i};--f:${prog.toFixed(3)}" pathLength="1" d="${p}"/>`:'')+
      `<path id="r${l.id}" d="${p}" fill="none" stroke="none"/>`;
  }).join('');

  if(w.status==='approved') w.listings.forEach((l,i)=>{
    const a = d.actions.find(x=>x.l===l), k = nKind(l,a), P = NPORTS[l.dest]; if(!P) return;
    const x = nx(P[0]), y = ny(P[1]), cy = Math.min(ky,y) - Math.hypot(x-kx,y-ky)*0.18;
    h += `<path class="rt ${k}" id="r${l.id}" ${k==='dsh'?'':'pathLength="1"'} style="--i:${i}" d="M${kx},${ky} Q${(kx+x)/2},${cy} ${x},${y}"/>`;
    const [dx,dy,an] = NLAB[l.dest]||[7,3,'start'];
    pts += `<g class="pt ${k}" data-id="${l.id}" tabindex="0" role="button" aria-label="${l.name}"><circle class="pl" cx="${x}" cy="${y}" r="5"/><circle class="d" cx="${x}" cy="${y}" r="4.5"/><text x="${x+dx}" y="${y+dy}" text-anchor="${an}">${l.dest}</text></g>`;
  });
  h += pts + `<g class="org"><circle cx="${kx}" cy="${ky}" r="5.5"/><text x="${kx-9}" y="${ky+15}" text-anchor="end">Jebel Ali</text></g>`;
  svg.innerHTML = h;
  /* ship marker on running routes */
  w.status==='approved' && w.listings.filter(l=>l.st==='running').forEach(l=>{
    const r = svg.querySelector('#r'+l.id); if(!r) return;
    const pt = r.getPointAtLength(r.getTotalLength()*l.stage/l.stages);
    svg.insertAdjacentHTML('beforeend',`<circle class="ship" cx="${pt.x}" cy="${pt.y}" r="5"/>`);
  });
  /* select: route <-> row */
  const sel = id => {
    const on = !!id && !svg.querySelector('#r'+id+'.sel');
    svg.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel')); atl.querySelectorAll('.row.sel').forEach(e=>e.classList.remove('sel'));
    atl.classList.toggle('has-sel',on);
    if(on){ const r=svg.querySelector('#r'+id), g=svg.querySelector('.pt[data-id="'+id+'"]'), rows=atl.querySelectorAll('.row[data-id="'+id+'"]');
      r&&r.classList.add('sel'); g&&g.classList.add('sel'); rows.forEach(e=>e.classList.add('sel')); }
  };
  svg.querySelectorAll('.pt').forEach(g=>{g.onclick=()=>sel(g.dataset.id); g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel(g.dataset.id)}}});
  atl.querySelectorAll('.row').forEach(r=>r.onclick=()=>sel(r.dataset.id));
  /* draggable sheet with three stops */
  const stops = [330,220,110], grab = document.getElementById('grab'); let idx = 0, y0 = 0, t0 = 0, moved = false;
  const setTop = (v,snap) => { atl.style.setProperty('--top',v+'px'); if(snap){idx=stops.indexOf(v); grab.setAttribute('aria-valuenow',idx)} };
  grab.onpointerdown = e => { grab.setPointerCapture(e.pointerId); y0 = e.clientY; t0 = stops[idx]; moved = false; atl.classList.add('drag') };
  grab.onpointermove = e => { if(!atl.classList.contains('drag')) return; if(Math.abs(e.clientY-y0)>3) moved = true; setTop(Math.max(110,Math.min(330,t0+(e.clientY-y0))),false) };
  grab.onpointerup = e => { atl.classList.remove('drag'); const cur = parseFloat(atl.style.getPropertyValue('--top'))||stops[idx];
    const near = moved ? stops.reduce((b,s)=>Math.abs(s-cur)<Math.abs(b-cur)?s:b) : stops[(idx+1)%3]; setTop(near,true) };
  grab.onkeydown = e => { if(e.key==='ArrowUp'){e.preventDefault(); setTop(stops[Math.min(2,idx+1)],true)} if(e.key==='ArrowDown'){e.preventDefault(); setTop(stops[Math.max(0,idx-1)],true)} };
}

/* ================= O: GLASS SELECTIVE ================= */
function VariantO(w,d){
  const first = w.name.split(' ')[0];
  const top = `<div class="otop oglass"><img src="../../Demo/frontend/brand/lockup.svg" alt="Shehnat"><button>Alerts${w.notif?' ('+w.notif+')':''}</button></div>`;
  const nav = `<nav class="onav oglass"><span class="on">Home</span><span>Listings</span><span>Wallet</span><span>Profile</span></nav>`;
  const n = d.actions.length;
  const hero = `<div class="ohero"><div class="g1">Good morning,</div><h1>${first}</h1><p>${w.status==='pending'?'Registration under review.':n?n+' need'+(n===1?'s':'')+' you today.':'Nothing is waiting on you.'}</p></div>`;
  if(w.status==='pending') return `<div class="gx2">${top}<div class="hz">${hero}</div><div class="body">${gate}</div>${nav}</div>`;
  const room = w.limit-d.used;
  const sum = `<div class="oglass glass dk sum rise" style="--i:0">
    <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--gold-300)"/><stop offset="1" style="stop-color:var(--green-200)"/></linearGradient></defs>
      <circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" cx="60" cy="60" r="52" data-ring="${d.pct}"/></svg>
      <div class="mid"><small>Exposure used</small><b class="num">${d.pct}%</b><small>of ${USD(w.limit)}</small></div></div>
    <div class="sts"><div><span class="ic" aria-hidden="true">&#9650;</span><span><b class="num">${USD(room)}</b><small>Room left</small></span></div>
      <div><span class="ic" aria-hidden="true">&#9673;</span><span><b class="num">${d.live} live</b><small>On the water</small></span></div>
      <div><span class="ic" aria-hidden="true">&#9635;</span><span><b class="num">${USD(w.wallet)}</b><small>Wallet</small></span></div></div></div>`;
  const acts = n ? d.actions.map((a,i)=>`<button class="o-row" data-a="${i}"><span class="k ${a.late?'late':''}"></span><span><b>${a.short}</b><small class="${a.late?'lt':''}">${a.l.name} &middot; ${a.late?'3 days late':a.when}</small></span><span class="cp">${a.cta}</span></button>`).join('')
    : `<div class="empty">${w.listings.length?'Nothing is waiting on you.':'No Listings yet. Create one to get started.'}</div>`;
  const lst = w.listings.length ? `<div class="oc rise" style="--i:2"><h2>Your Listings<em>${w.listings.length}</em></h2>${w.listings.map(l=>{const a=d.actions.find(x=>x.l===l);return `<div class="o-li ${a?'a':''}"><b>${l.name}</b><small class="muted">${a?a.short+' &middot; ':''}${ST[l.st][0]}</small><span class="am num ${l.st==='done'?'g':''}">${l.st==='done'?'&#9650; +'+l.result+'%':USD(l.target)}</span></div>`}).join('')}</div>` : '';
  return `<div class="gx2">${top}<div class="hz">${hero}${sum}</div><div class="body">
    <div class="oc rise" style="--i:1"><h2>Needs you<em>${n} open</em></h2>${acts}</div>
    ${lst}<button class="btn gold rise" style="--i:3">+ New Listing</button></div>${nav}</div>`;
}
function mountO(w,d){
  const old = document.getElementById('dlgO'); if(old) old.remove();
  const close = () => { const x = document.getElementById('dlgO'); if(x){x.remove(); document.removeEventListener('keydown',esc)} };
  const esc = e => { if(e.key==='Escape') close() };
  document.querySelectorAll('.o-row').forEach(r=>r.onclick=()=>{
    const a = d.actions[+r.dataset.a]; if(!a) return;
    const body = a.kind.startsWith('Pay the deposit') ? (a.wallet ? `Your wallet is short by ${USD(a.wallet)}. Add funds first, then pay.` : `${USD(a.l.deposit)} leaves your wallet now. You will have ${USD(w.wallet-a.l.deposit)} left. ${a.when} to pay.`)
      : a.late ? `${a.l.name} is 3 days behind plan. Open the step to see what is blocking it.` : `${a.l.name}: ${a.kind.toLowerCase()}.`;
    document.body.insertAdjacentHTML('beforeend',`<div class="odlg" id="dlgO"><div class="oglass opn" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${a.kind}</h3><p>${body}</p><div class="ft"><button class="btn ghost" data-x>Not now</button><button class="btn" data-x ${a.wallet?'disabled style="opacity:.5"':''}>${a.wallet?'Add funds':a.cta}</button></div></div></div>`);
    const dl = document.getElementById('dlgO'); dl.onclick = e => { if(e.target===dl || e.target.hasAttribute('data-x')) close() };
    document.addEventListener('keydown',esc); dl.querySelector('.btn:not(.ghost)').focus();
  });
}

/* ---------- switcher + render ---------- */
const VARIANTS = {A:['The Yard',VariantA],B:['Voyage map',VariantB],C:['Manifest',VariantC],D:['Calm',VariantD],E:['Glass',VariantE],F:['Glass dark',VariantF],G:['Ledger mono',VariantG],H:['Bento board',VariantH],I:['Soft pastel',VariantI],J:['Big number',VariantJ],K:['Boarding pass',VariantK],L:['Aurora dark',VariantL],M:['Paper editorial',VariantM],N:['Atlas map',VariantN],O:['Glass selective',VariantO],P:['Glass focus',VariantP]};
const keys = Object.keys(VARIANTS);
const qs = new URLSearchParams(location.search);
let variant = VARIANTS[qs.get('variant')] ? qs.get('variant') : 'A';
let world = WORLDS[qs.get('world')] ? qs.get('world') : 'busy';
let dir = 'ltr', full = false;

function setURL(){const u=new URL(location);u.searchParams.set('variant',variant);u.searchParams.set('world',world);history.replaceState(null,'',u)}
function render(){
  const w = WORLDS[world], d = derive(w);
  const own = 'DEFGIJLMNOP'.includes(variant), navs = {D:tabsD,E:'',F:'',I:navI,L:navL,M:navM,O:'',P:''};
  document.getElementById('phone').innerHTML = (own?'':header(w)) + VARIANTS[variant][1](w,d) + (variant in navs?navs[variant]:tabs);
  document.getElementById('phone').classList.toggle('pastel',variant==='I');
  document.getElementById('phone').classList.toggle('aurora',variant==='L');
  document.getElementById('phone').classList.toggle('glassy',variant==='E'||variant==='F'||variant==='P');
  document.getElementById('phone').classList.toggle('dark',variant==='F');
  document.documentElement.dir = dir; document.body.classList.toggle('full',full);
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%')));
  document.querySelectorAll('[data-up]').forEach(e=>countUp(e,+e.dataset.up,e.closest('.huge')?String:USD));
  if(variant==='A'){
    const g=document.getElementById('gate'); if(g) g.onclick=()=>{const cs=[...document.querySelectorAll('.cont[data-act="1"]')];cs.forEach(c=>{c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse')});cs[0]&&cs[0].scrollIntoView({behavior:'smooth',block:'center'})};
  }
  if(variant==='B' && w.status!=='pending') mountB(w,d);
  if(variant==='D' && w.status!=='pending') mountD(w,d);
  if('EFIOP'.includes(variant) && w.status!=='pending') mountE(w,d);
  if(variant==='O') mountO(w,d); else {const x=document.getElementById('dlgO'); if(x) x.remove()}
  if(variant==='N') mountN(w,d);
  document.getElementById('pbar').innerHTML =
    `<button id="prev" aria-label="Previous variant">←</button><span class="lbl">${variant} (${VARIANTS[variant][0]})</span><button id="next" aria-label="Next variant">→</button>
     <select id="world" aria-label="Data"><option value="busy">UAE (busy)</option><option value="empty">New manager (no Listings)</option><option value="pending">Registration pending (gate)</option></select>
     <button id="dir">${dir.toUpperCase()}</button><button id="frame">${full?'Full':'Phone'}</button>`;
  document.getElementById('pbar').hidden = false;
  document.getElementById('world').value = world;
  document.getElementById('prev').onclick=()=>step(-1); document.getElementById('next').onclick=()=>step(1);
  document.getElementById('world').onchange=e=>{world=e.target.value;setURL();render()};
  document.getElementById('dir').onclick=()=>{dir=dir==='ltr'?'rtl':'ltr';render()};
  document.getElementById('frame').onclick=()=>{full=!full;render()};
}
function step(n){variant = keys[(keys.indexOf(variant)+n+keys.length)%keys.length]; setURL(); render()}
addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable) return;
  if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1);
});
render();
</script>
